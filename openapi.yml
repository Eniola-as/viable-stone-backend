            CONFLICT (a real sale that cannot be applied now — retained for the owner): stock_not_available, sale_in_progress.
            OWNER_REVIEW_REQUIRED (the offline session was over — ended, force-ended, revoked, replaced, or its window had lapsed — when this sale synced): closed, force_closed, revoked, replaced, expired.
