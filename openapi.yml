  /api/v1/expense-categories/:
    get:
      operationId: expense_categories_list
      description: |-
        Restrict list/detail querysets to the caller's branch.

        - Owners and employees only ever see their own branch's rows, so a guessed
          object id from another branch returns 404, not another branch's data.
        - The technical administrator is not a business actor; by default they see
          nothing here unless ``tech_admin_sees_all`` is set on the view.
      summary: List expense categories (owner)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenseCategoryList'
          description: ''
    post:
      operationId: expense_categories_create
      description: |-
        Restrict list/detail querysets to the caller's branch.

        - Owners and employees only ever see their own branch's rows, so a guessed
          object id from another branch returns 404, not another branch's data.
        - The technical administrator is not a business actor; by default they see
          nothing here unless ``tech_admin_sees_all`` is set on the view.
