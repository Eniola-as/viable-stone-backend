  /api/v1/reports/best-sellers/:
    get:
      operationId: reports_best_sellers_list
      description: |-
        Owner-only computed reports. No cost/profit ever reaches an employee.

        None of these actions paginate. ``profit`` / ``inventory`` return one
        summary object; ``best-sellers`` / ``slow-movers`` return a **bare array**
        capped by ``?limit`` (1..100, default 10 / 20) — ``page`` / ``page_size``
        are ignored (G18 / G13). ``pagination_class = None`` keeps the generated
        schema honest.
      summary: Best-selling variants for a period
      parameters:
      - in: query
        name: end
        schema:
          type: string
        description: ISO date, inclusive (custom period)
      - in: query
        name: limit
        schema:
          type: integer
        description: max rows (best/slow sellers)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: period
        schema:
          type: string
        description: today | week | month | custom
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
        description: ISO date (custom period)
      tags:
      - Reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BestSeller'
          description: ''
        default:
          $ref: '#/components/responses/Error'
