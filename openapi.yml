    OfflineSaleLookup:
      type: object
      description: |-
        ``GET /offline/sales/{client_sale_id}/`` — one submitted offline sale.

        Carries the sync-record's outcome **and** resolution state so the bound
        cashier's device can clear a "needs the owner" row even when the owner
        resolved it without creating an official Sale (a resolved CONFLICT, or any
        REJECTED). No cost, token or customer data.
      properties:
        client_sale_id:
          type: string
          format: uuid
          readOnly: true
        device_sequence:
          type: integer
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        detail_code:
          type: string
          readOnly: true
          description: |-
            detail_code accompanies the outcome; it is "" for ACCEPTED / DUPLICATE.
            REJECTED (invalid payload — the device already took real money, so the owner must reconcile it manually): duplicate_sequence, outside_window, invalid_timestamp, empty_cart, price_not_in_snapshot, invalid_quantity, payment_required, invalid_payment_method, invalid_payment_amount, reference_required, invalid_tendered_amount, payment_mismatch, variant_not_found, variant_unavailable.
            CONFLICT (a real sale that cannot be applied now — retained for the owner): stock_not_available, sale_in_progress.
            OWNER_REVIEW_REQUIRED (the offline session was over — ended, force-ended, revoked, replaced, or its window had lapsed — when this sale synced): closed, force_closed, revoked, replaced, expired.
        sale_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        receipt_number:
          type: string
          readOnly: true
          nullable: true
        resolved:
          type: boolean
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolution_note:
          type: string
          readOnly: true
        resolution_kind:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OfflineReconciliationKindEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - client_sale_id
      - detail_code
      - device_sequence
      - outcome
      - receipt_number
      - resolution_kind
      - resolution_note
      - resolved
      - resolved_at
      - sale_id
