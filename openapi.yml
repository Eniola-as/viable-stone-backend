openapi: 3.0.3
info:
  title: Viable Stone Paint Shop API
  version: 1.0.0
  description: Internal management API for the Viable Stone paint and painting-equipment
    shop. Source of truth for authentication, prices, stock, sales, payments, receipts,
    expenses, approvals and reports.
paths:
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      summary: List audit history
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      summary: Retrieve one audit entry
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit log.
        required: true
      tags:
      - Audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Bootstrap the CSRF cookie for the SPA before its first write request.
      summary: Set the CSRF cookie
      tags:
      - Auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Sign in with username and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Sign out
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: The signed-in user's profile
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
          description: ''
  /api/v1/auth/mfa/recovery/:
    post:
      operationId: auth_mfa_recovery_create
      summary: Clear MFA using a one-use recovery code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/mfa/recovery-codes/regenerate/:
    post:
      operationId: auth_mfa_recovery_codes_regenerate_create
      summary: Replace the current recovery codes with a fresh set
