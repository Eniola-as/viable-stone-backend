          readOnly: true
        resolved:
          type: boolean
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolution_note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        verified_snapshot_total:
          type: string
          nullable: true
          readOnly: true
        retained_payments_total:
          type: string
          nullable: true
          readOnly: true
