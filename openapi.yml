  /api/v1/offline/sync-records/{id}/reconcile/:
    post:
      operationId: offline_sync_records_reconcile_create
      description: |-
        The safe resolution of a CONFLICT / REJECTED / OWNER_REVIEW_REQUIRED record — no Sale, stock, payment, revenue or COGS exists for it yet. Polymorphic on `kind`:

        * `RECORDED_AS_SALE` — the backend re-reads the retained payload and the *verified* signed snapshot and creates the official Sale itself (authoritative prices / COGS / one receipt). Needs `counts` (one per affected variant) when the outcome is `CONFLICT` or stock is short. `payment_references` is a **structured** list — `[{ payment_index, reference }]` — where `payment_index` is the 0-based position in the record's `retained_payments` read model; one entry per retained Transfer/POS line, so a split batch is never mis-mapped. `amount_source` on the result is always `SNAPSHOT_VERIFIED` (a Sale is only built from a verified total).
        * `REFUNDED_AND_RETURNED` — full return + full refund only; no Sale / Payment / stock movement is created. `refunds` must total the money **actually collected** from the customer — NOT the catalogue total. That amount is trusted automatically only when the retained device payments parse cleanly and equal the verified snapshot total (`amount_source: RETAINED_PAYMENTS_MATCHED_TO_SNAPSHOT`). If they disagree, or the retained data cannot be verified (broken signature / binding, malformed items), the request must carry `owner_attestation: true` + `attested_offline_total` (the amount actually collected) + a ≥40-char `explanation`; the result is flagged `amount_source: OWNER_ATTESTED` (never presented as cryptographically verified). A non-positive collected amount -> `no_payment_to_refund` (it is not a refund). The owner-only response carries `verified_snapshot_total` + `retained_payments_total` diagnostics; those, and owner-entered `refunds[].reference`, are excluded from the cashier `OfflineSaleLookup` and from every audit-log row.
        * `LINKED_EXISTING_SALE` — fallback when the retained data cannot be verified; links an owner-entered COMPLETED sale in this branch. The backend compares three dimensions — (1) line items & quantities, (2) payment methods & amounts, (3) transaction total — against the retained record; any comparable dimension that mismatches -> `sale_incompatible`. `link_verification` reports `FULL` (all three comparable and matched), `PARTIAL` (every comparable one matched, fewer than three comparable) or `MANUAL_ATTESTED` (none comparable — needs `owner_attestation: true` + a ≥40-char `explanation`). Always `linked_manually: true`.

        Owner + MFA. Idempotent per record. A resolved record cannot be reconciled again. Stable codes: `offline_reconciliation_required`, `offline_record_not_reconcilable`, `offline_record_already_resolved`, `physical_count_required`, `count_variant_missing`, `count_variant_unexpected`, `count_variant_duplicated`, `invalid_count`, `reference_required`, `payment_reference_index_invalid`, `payment_reference_duplicated`, `payment_reference_unexpected`, `payment_mismatch`, `refund_total_mismatch`, `refund_required`, `invalid_refund_amount`, `no_payment_to_refund`, `offline_total_unverifiable`, `attested_total_required`, `attestation_explanation_too_short`, `partial_reconciliation_unsupported`, `offline_data_untrusted`, `sale_reference_required`, `sale_already_linked`, `sale_incompatible`, `manual_verification_required`, `not_found`.
      summary: Reconcile an accounting-impacting sync record (owner + MFA)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this offline sale sync record.
        required: true
      tags:
      - Offline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineReconcileRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfflineReconcileRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfflineReconcileRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineReconciliationResult'
          description: ''
        default:
          $ref: '#/components/responses/Error'
  /api/v1/offline/sync-records/{id}/resolve/:
    post:
      operationId: offline_sync_records_resolve_create
      description: 'A CONFLICT / REJECTED / OWNER_REVIEW_REQUIRED record affects stock,
        revenue, payments and COGS and can no longer be closed with a note: this returns
        `409 offline_reconciliation_required`. Use `POST /api/v1/offline/sync-records/{id}/reconcile/`.
