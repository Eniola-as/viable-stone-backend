openapi: 3.0.3
info:
  title: Viable Stone Paint Shop API
  version: 1.0.0
  description: Internal management API for the Viable Stone paint and painting-equipment
    shop. Source of truth for authentication, prices, stock, sales, payments, receipts,
    expenses, approvals and reports.
paths:
  /api/v1/approvals/:
    get:
      operationId: approvals_list
      summary: List approval requests
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: request_type
        required: false
        in: query
        description: Filter by approval type (exact).
        schema:
          type: string
          enum:
          - DISCOUNT
          - RETURN
          - CORRECTION
          - STOCK_ADJUSTMENT
          - DAMAGE
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: status
        required: false
        in: query
        description: Filter by approval status (exact).
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
      tags:
      - Approvals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestList'
          description: ''
        default:
          $ref: '#/components/responses/Error'
  /api/v1/approvals/{id}/:
    get:
      operationId: approvals_retrieve
      summary: Retrieve an approval request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval request.
        required: true
      tags:
      - Approvals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
        default:
          $ref: '#/components/responses/Error'
  /api/v1/approvals/{id}/approve/:
    post:
      operationId: approvals_approve_create
      description: |-
        Polymorphic on the approval's `request_type` (read it from `GET /api/v1/approvals/{id}/` first):

        * `DISCOUNT` — body `{amount, reviewer_note?}`; returns the updated `ApprovalRequest`.
        * `RETURN` — body `{lines[], refunds[], reviewer_note?, client_return_id?}`; returns the created `SaleReturn`.

        Sending the wrong body yields `400` naming the missing field(s) (`amount`, or `lines`/`refunds`).
      summary: Approve a pending request (owner)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval request.
        required: true
      tags:
      - Approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResult'
          description: ''
        default:
          $ref: '#/components/responses/Error'
  /api/v1/approvals/{id}/reject/:
    post:
      operationId: approvals_reject_create
      summary: Reject a pending request (owner) — return or discount
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval request.
        required: true
      tags:
