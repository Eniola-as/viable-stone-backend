        Returned for a record in **any** outcome — not only once an official Sale exists — so the device can clear a held row when the owner resolves a `CONFLICT` without creating a Sale, or resolves a `REJECTED` (which never creates one): `resolved` / `resolved_at` / `resolution_note` flip while `outcome` stays `CONFLICT` / `REJECTED` and `sale_id` stays `null`.
      summary: 'Look up one offline sale: outcome, resolution state and Sale mapping'
      parameters:
      - in: path
        name: client_sale_id
