    SaleDiscountRequestSummary:
      type: object
      description: |-
        G22 — minimal, read-only view of a sale's DISCOUNT ``ApprovalRequest``.

        Only DISCOUNT-type requests reach here. Deliberately excludes the draft
        ``fingerprint``, the ``subtotal`` snapshot, raw user ids and every
        owner-only financial field. ``status`` reuses the canonical
        ``ApprovalStatusEnum`` (``PENDING`` / ``APPROVED`` / ``REJECTED``) — the
        model has no ``CANCELLED``/``EXPIRED`` state, so a request voided by a cart
        edit or a draft cancel is a ``REJECTED`` row with ``reviewed_by_username``
        ``null`` and a ``reviewer_note`` that starts ``"Superseded: "``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        requested_amount:
          type: string
          readOnly: true
        approved_amount:
          type: string
          nullable: true
          readOnly: true
        reason:
          type: string
          readOnly: true
        reviewer_note:
          type: string
          readOnly: true
        requested_by_username:
          type: string
          readOnly: true
        reviewed_by_username:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_amount
      - created_at
      - id
      - reason
      - requested_amount
      - requested_by_username
      - reviewed_at
      - reviewed_by_username
      - reviewer_note
      - status
