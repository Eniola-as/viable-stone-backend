  responses:
    Error:
      description: Error envelope — 400/401/403/404/405/409/413/415/422/429/500 all
        use this shape. See the `Error` schema and FRONTEND_HANDOFF.md for the stable
        `code` catalogue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
