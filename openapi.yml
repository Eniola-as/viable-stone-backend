    _ReconcileRefundRequest:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MethodEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        reference:
          type: string
          default: ''
          maxLength: 150
      required:
      - amount
      - method
    _RetainedPayment:
      type: object
      description: |-
        One retained offline payment line — the owner uses ``payment_index`` to
        associate a Transfer/POS reference on RECORDED_AS_SALE. The device's
        original reference was never stored; ``method`` + ``amount`` only.
      properties:
        payment_index:
          type: integer
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          readOnly: true
        amount:
          type: string
          readOnly: true
        reference_required:
          type: boolean
          readOnly: true
      required:
      - amount
      - method
      - payment_index
      - reference_required
    Error:
      type: object
      description: Standard error envelope. Every non-2xx response has this shape.
        `code` is a stable machine-readable string that frontend logic may branch
        on; `message` is human-readable and may change; `field_errors` maps a field
        name to its messages on a 400 validation error (empty otherwise); `request_id`
        echoes `X-Request-ID` for support. Internal exception names, stack traces
        and secrets are never included.
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
      required:
      - code
      - message
      - field_errors
      - request_id
