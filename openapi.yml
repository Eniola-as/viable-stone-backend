components:
  schemas:
    AmountSourceEnum:
      enum:
      - SNAPSHOT_VERIFIED
      - RETAINED_PAYMENTS_MATCHED_TO_SNAPSHOT
      - OWNER_ATTESTED
      type: string
      description: |-
        * `SNAPSHOT_VERIFIED` - Sale total recomputed from the cryptographically verified frozen snapshot
        * `RETAINED_PAYMENTS_MATCHED_TO_SNAPSHOT` - Retained device payments parsed cleanly and equal the verified snapshot total
        * `OWNER_ATTESTED` - Owner-attested amount collected (retained data could not establish it)
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_type:
          allOf:
          - $ref: '#/components/schemas/RequestTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        sale:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        variant:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        stock_count:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        requested_changes:
          readOnly: true
        requested_by:
          type: string
          format: uuid
          readOnly: true
        requested_by_username:
          type: string
          readOnly: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewer_note:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - reason
      - request_type
      - requested_by
      - requested_by_username
      - requested_changes
      - reviewed_at
      - reviewed_by
      - reviewer_note
      - sale
      - status
      - stock_count
      - updated_at
      - variant
    ApprovalStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
