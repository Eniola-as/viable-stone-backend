      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
          description: ''
  /api/v1/auth/mfa/setup/:
    post:
      operationId: auth_mfa_setup_create
      summary: Begin authenticator (TOTP) enrolment
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
          description: ''
  /api/v1/auth/mfa/setup/confirm/:
    post:
      operationId: auth_mfa_setup_confirm_create
