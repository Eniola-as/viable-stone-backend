  /api/v1/offline/authorizations/{id}/snapshot/:
    get:
      operationId: offline_authorizations_snapshot_retrieve
      description: |-
        The disconnected offline device reads this once at session start to build sales against fixed prices and quantities, then presents the returned `signed_token` back to `/offline/sync/` and `/offline/temporary-receipt/` as `authorization_token`. The snapshot is frozen for the life of the session — repeated reads are identical and never pick up newer prices or stock. Response is `Cache-Control: private, no-store`.

        Binding is proven server-side: the GET carries no body and no client token; the server re-verifies its own stored `signed_token` (the same HMAC + constant-time check `/offline/sync/` uses) and the verified branch / device / cashier must match the row and the caller, and the bound device must still be the branch's one ACTIVE registered device.

        **404 (indistinguishable, reveals nothing):** wrong cashier, wrong branch, unknown id, or the bound device is no longer the active registered device. **409 standard error envelope (the session is provably yours but over):** `offline_authorization_expired` when expired, `offline_session_not_active` when revoked / replaced / force-closed / closed. **400 `invalid_signature`:** the stored token fails verification.
      summary: Read the active session's signed fixed-price catalogue snapshot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this offline device authorization.
        required: true
      tags:
      - Offline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineCatalogueSnapshot'
          description: ''
        default:
          $ref: '#/components/responses/Error'
