            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - cookieAuth: []
