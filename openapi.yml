    OfflineDeviceStatusEnum:
      enum:
      - ACTIVE
      - REVOKED
      - REPLACED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `REVOKED` - Revoked
        * `REPLACED` - Replaced
    OfflineReconcileRequestRequest:
      type: object
      description: |-
        Owner reconciliation of a CONFLICT / REJECTED / OWNER_REVIEW_REQUIRED
        record. Fields apply per ``kind``:

        * ``RECORDED_AS_SALE`` — ``explanation``; ``counts`` (one per affected
          variant — **required** when the record's outcome is ``CONFLICT`` or when
          stock is short); ``payment_references`` as
          ``[{payment_index, reference}]`` where ``payment_index`` is the 0-based
          position in the record's ``retained_payments`` (one entry per retained
          Transfer/POS payment). The backend reads the retained payload + verified
          signed snapshot; you never resend lines, prices, amounts or the customer.
        * ``REFUNDED_AND_RETURNED`` — ``explanation``; ``all_goods_returned`` and
          ``full_amount_refunded`` must both be ``true``; ``refunds`` must total the
          money **actually collected** from the customer (Transfer/POS refund needs
          a ``reference``). That amount is trusted automatically **only** when the
          retained device payments parse cleanly and equal the verified snapshot
          total (``amount_source: RETAINED_PAYMENTS_MATCHED_TO_SNAPSHOT``). If they
          disagree, or the retained data cannot be verified, set
          ``owner_attestation: true`` + ``attested_offline_total`` (the amount
          actually collected, from physical evidence) + a ≥40-char ``explanation``;
          the result is flagged ``amount_source: OWNER_ATTESTED``. A non-positive
          collected amount is rejected (``no_payment_to_refund``). No Sale /
          Payment / stock movement is created.
        * ``LINKED_EXISTING_SALE`` — fallback; ``explanation`` and one of
          ``sale_id`` / ``receipt_number`` for a COMPLETED sale in this branch. The
          backend compares three dimensions — (1) line items & quantities,
          (2) payment methods & amounts, (3) transaction total — against the
          retained record; any comparable dimension that mismatches ->
          ``sale_incompatible``. If **nothing** is comparable, set
          ``owner_attestation: true`` + a ≥40-char ``explanation``
          (``link_verification: MANUAL_ATTESTED``).
      properties:
        kind:
          $ref: '#/components/schemas/OfflineReconciliationKindEnum'
        explanation:
          type: string
          minLength: 10
          maxLength: 2000
        counts:
          type: array
          items:
            $ref: '#/components/schemas/_ReconcileCountRequest'
        payment_references:
          type: array
          items:
            $ref: '#/components/schemas/_ReconcilePaymentReferenceRequest'
        all_goods_returned:
          type: boolean
          default: false
        full_amount_refunded:
          type: boolean
          default: false
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/_ReconcileRefundRequest'
        owner_attestation:
          type: boolean
          default: false
        attested_offline_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        sale_id:
          type: string
          format: uuid
        receipt_number:
          type: string
          maxLength: 40
      required:
      - explanation
      - kind
    OfflineReconciliation:
      type: object
      description: |-
        Owner + MFA only (returned by the ``reconcile`` action).

        ``verified_snapshot_total`` and ``retained_payments_total`` are owner-only
        diagnostics for a REFUNDED_AND_RETURNED that needed an attestation — they
        show the verified catalogue total and the retained device payment total
        side by side. They are absent from the cashier ``OfflineSaleLookup`` and
        are never written to an audit-log row.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/OfflineReconciliationKindEnum'
          readOnly: true
        resolved_by_username:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
        explanation:
          type: string
          readOnly: true
        sale_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        receipt_number:
          type: string
          readOnly: true
        refund_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        amount_source:
          allOf:
          - $ref: '#/components/schemas/AmountSourceEnum'
          readOnly: true
        link_verification:
          allOf:
          - $ref: '#/components/schemas/LinkVerificationEnum'
          readOnly: true
        linked_manually:
          type: boolean
          readOnly: true
        completion_time_substituted:
          type: boolean
          readOnly: true
        verified_snapshot_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        retained_payments_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/_OfflineReconRefundRead'
          readOnly: true
        counts:
          type: array
          items:
            $ref: '#/components/schemas/_OfflineReconCountRead'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_source
      - completion_time_substituted
      - counts
      - created_at
      - explanation
      - id
      - kind
      - link_verification
      - linked_manually
      - receipt_number
      - refund_total
      - refunds
      - resolved_at
      - resolved_by_username
      - retained_payments_total
      - sale_id
      - verified_snapshot_total
    OfflineReconciliationKindEnum:
      enum:
      - RECORDED_AS_SALE
      - REFUNDED_AND_RETURNED
      - LINKED_EXISTING_SALE
      type: string
      description: |-
        * `RECORDED_AS_SALE` - Recorded as an official sale
        * `REFUNDED_AND_RETURNED` - Refunded — all goods returned, no sale
        * `LINKED_EXISTING_SALE` - Linked to an owner-entered official sale
