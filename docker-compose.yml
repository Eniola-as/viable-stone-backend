# Local development helper. Brings up Redis for the shared cache, DRF
# throttling and django-axes counters. PostgreSQL 18 is expected on the host
# (this is not a production topology and deploys nothing).
#
# Usage:
#   docker compose up -d
#   REDIS_URL=redis://127.0.0.1:6379/0 CACHE_BACKEND=redis \
#       .venv/Scripts/python manage.py runserver
#
# The Redis image is pinned by its verified multi-architecture manifest-list
# digest (Docker Hub, library/redis), confirmed on 2026-08-27 to equal
# redis:7.4-alpine. To re-verify:
#   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/redis:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://registry-1.docker.io/v2/library/redis/manifests/7.4.11-alpine | grep -i docker-content-digest

name: viable-stone-dev

services:
  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 127.0.0.1 only — never exposed on the LAN.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
